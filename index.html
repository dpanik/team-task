<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Team Task Board — рабочая доска задач для небольшой команды." />
    <title>Team Task Board</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#board">Перейти к доске</a>

    <header class="topbar">
      <div class="brand" aria-label="Team Task Board">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Team Task Board</span>
      </div>
      <div class="topbar-actions">
        <div class="team-stack" aria-label="Участники команды">
          <span class="avatar avatar-blue" title="Анна Лебедева">АЛ</span>
          <span class="avatar avatar-green" title="Михаил Орлов">МО</span>
          <span class="avatar avatar-violet" title="Елена Волкова">ЕВ</span>
          <span class="avatar avatar-orange" title="Дмитрий Соколов">ДС</span>
        </div>
        <button class="icon-button" type="button" aria-label="Открыть уведомления" id="notificationsButton">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
          <span class="notification-dot" aria-hidden="true"></span>
        </button>
        <span class="avatar avatar-current" title="Ваш профиль">ИП</span>
      </div>
    </header>

    <main>
      <section class="workspace-head" aria-labelledby="page-title">
        <div>
          <div class="eyebrow"><span class="live-dot"></span>Командная доска</div>
          <h1 id="page-title">Задачи команды</h1>
          <p>Планирование и контроль работы на текущую неделю</p>
        </div>
        <button class="button button-primary" type="button" id="addTaskButton">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Новая задача
        </button>
      </section>

      <section class="toolbar" aria-label="Поиск и фильтры">
        <label class="search-field">
          <span class="sr-only">Поиск по названию</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="Поиск задач" autocomplete="off" />
          <kbd title="Быстрый поиск">/</kbd>
        </label>
        <div class="filters">
          <label class="select-wrap">
            <span class="sr-only">Фильтр по исполнителю</span>
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-4 3.1-6 7-6s6.2 2 7 6"/></svg>
            <select id="assigneeFilter">
              <option value="all">Все исполнители</option>
            </select>
          </label>
          <label class="select-wrap">
            <span class="sr-only">Фильтр по приоритету</span>
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4v17M5 5h11l-2 4 2 4H5"/></svg>
            <select id="priorityFilter">
              <option value="all">Любой приоритет</option>
              <option value="high">Высокий</option>
              <option value="medium">Средний</option>
              <option value="low">Низкий</option>
            </select>
          </label>
          <button class="button button-ghost reset-button" id="resetFilters" type="button" hidden>Сбросить</button>
        </div>
        <p class="results-count" id="resultsCount" aria-live="polite"></p>
      </section>

      <section class="board" id="board" aria-label="Доска задач">
        <div class="board-column" data-status="new">
          <header class="column-head">
            <div class="column-title"><span class="status-marker status-new"></span><h2>Новые</h2><span class="count" data-count="new">0</span></div>
            <button class="column-add" type="button" data-add-status="new" aria-label="Добавить задачу в Новые">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </header>
          <div class="task-list" data-list="new"></div>
        </div>
        <div class="board-column" data-status="progress">
          <header class="column-head">
            <div class="column-title"><span class="status-marker status-progress"></span><h2>В работе</h2><span class="count" data-count="progress">0</span></div>
            <button class="column-add" type="button" data-add-status="progress" aria-label="Добавить задачу в В работе">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </header>
          <div class="task-list" data-list="progress"></div>
        </div>
        <div class="board-column" data-status="review">
          <header class="column-head">
            <div class="column-title"><span class="status-marker status-review"></span><h2>На проверке</h2><span class="count" data-count="review">0</span></div>
            <button class="column-add" type="button" data-add-status="review" aria-label="Добавить задачу в На проверке">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </header>
          <div class="task-list" data-list="review"></div>
        </div>
        <div class="board-column" data-status="done">
          <header class="column-head">
            <div class="column-title"><span class="status-marker status-done"></span><h2>Готово</h2><span class="count" data-count="done">0</span></div>
            <button class="column-add" type="button" data-add-status="done" aria-label="Добавить задачу в Готово">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </header>
          <div class="task-list" data-list="done"></div>
        </div>
      </section>
    </main>

    <dialog class="modal" id="taskModal" aria-labelledby="modalTitle">
      <form id="taskForm" novalidate>
        <header class="modal-head">
          <div><p class="modal-kicker" id="modalKicker">Новая задача</p><h2 id="modalTitle">Добавить задачу</h2></div>
          <button class="icon-button close-button" type="button" data-close-modal aria-label="Закрыть форму">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </header>
        <div class="modal-body">
          <input type="hidden" id="taskId" />
          <div class="field field-full">
            <label for="taskTitle">Название <span aria-hidden="true">*</span></label>
            <input id="taskTitle" name="title" maxlength="80" placeholder="Например, подготовить макеты" required />
            <span class="field-error" id="titleError"></span>
          </div>
          <div class="field field-full">
            <label for="taskDescription">Описание</label>
            <textarea id="taskDescription" name="description" rows="4" maxlength="300" placeholder="Добавьте контекст и ожидаемый результат"></textarea>
            <span class="field-hint"><span id="descriptionCount">0</span>/300</span>
          </div>
          <div class="field">
            <label for="taskAssignee">Исполнитель <span aria-hidden="true">*</span></label>
            <select id="taskAssignee" name="assignee" required></select>
          </div>
          <div class="field">
            <label for="taskPriority">Приоритет</label>
            <select id="taskPriority" name="priority">
              <option value="low">Низкий</option><option value="medium" selected>Средний</option><option value="high">Высокий</option>
            </select>
          </div>
          <div class="field">
            <label for="taskDueDate">Срок <span aria-hidden="true">*</span></label>
            <input id="taskDueDate" name="dueDate" type="date" required />
            <span class="field-error" id="dateError"></span>
          </div>
          <div class="field">
            <label for="taskStatus">Статус</label>
            <select id="taskStatus" name="status">
              <option value="new">Новые</option><option value="progress">В работе</option><option value="review">На проверке</option><option value="done">Готово</option>
            </select>
          </div>
        </div>
        <footer class="modal-footer">
          <button class="button button-ghost" type="button" data-close-modal>Отмена</button>
          <button class="button button-primary" type="submit" id="saveTaskButton">Создать задачу</button>
        </footer>
      </form>
    </dialog>

    <dialog class="confirm-modal" id="confirmModal" aria-labelledby="confirmTitle">
      <div class="confirm-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>
      </div>
      <h2 id="confirmTitle">Удалить задачу?</h2>
      <p>Это действие нельзя отменить. Задача будет удалена с доски.</p>
      <div class="confirm-actions"><button class="button button-ghost" id="cancelDelete" type="button">Отмена</button><button class="button button-danger" id="confirmDelete" type="button">Удалить</button></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg><span id="toastText"></span>
    </div>

    <template id="taskTemplate">
      <article class="task-card">
        <div class="task-card-top"><span class="priority-badge"></span><button class="card-menu" type="button" aria-label="Действия с задачей"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div>
        <h3 class="task-title"></h3>
        <p class="task-description"></p>
        <div class="task-menu" hidden><button type="button" data-action="edit"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L19 9l-4-4L4 16ZM13 7l4 4"/></svg>Редактировать</button><button type="button" data-action="delete" class="delete-action"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>Удалить</button></div>
        <div class="task-meta"><span class="assignee"><span class="avatar"></span><span class="assignee-name"></span></span><time class="due-date"></time></div>
        <label class="status-control"><span>Статус</span><select class="card-status"><option value="new">Новые</option><option value="progress">В работе</option><option value="review">На проверке</option><option value="done">Готово</option></select></label>
      </article>
    </template>
  </body>
</html>
